name: Tag ansible version

# The Dependabot auto-merge workflow dispatches this after merging, because its
# push to main triggers no workflows.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-ansible
  cancel-in-progress: false

jobs:
  tag-ansible:
    runs-on: [self-hosted, mr-amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build image
        run: |
          docker build --pull -t local/ansible .

      - name: Read ansible version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          output=$(docker run --rm local/ansible ansible --version)
          printf '%s\n' "$output"
          line=${output%%$'\n'*}
          version=$(printf '%s' "$line" | grep -oE '([0-9]+\.){2}[0-9]+' | head -n1 || true)
          if [[ -z "$version" ]]; then
            echo "Unable to parse ansible version from: $line" >&2
            exit 1
          fi
          tagName="v$version"
          echo "::notice title=Ansible version::Ansible $version"
          echo "version=$tagName" >> "$GITHUB_OUTPUT"
          echo "version_plain=$version" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          version="${{ steps.version.outputs.version }}"
          if git tag --list "$version" | grep -q .; then
            echo "Tag $version already exists"
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "$version"
          git push origin "$version"
          echo "tag_created=true" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.tag.outputs.tag_created == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version_plain }}
          body: "Update Ansible to ${{ steps.version.outputs.version_plain }}"

      - name: Trigger Docker publish
        if: steps.tag.outputs.tag_created == 'true'
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ steps.version.outputs.version }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "docker-publish.yml",
              ref: "main",
              inputs: {
                tag: process.env.TAG_NAME
              }
            });

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version_plain }}
          TAG_NAME: ${{ steps.version.outputs.version }}
          TAG_CREATED: ${{ steps.tag.outputs.tag_created }}
        run: |
          if [[ "$TAG_CREATED" == "true" ]]; then
            result="Created tag \`$TAG_NAME\` and its release, and triggered Docker Publish."
          else
            result="Tag \`$TAG_NAME\` already exists, nothing to release."
          fi
          printf '### Ansible %s\n\n%s\n' "$VERSION" "$result" >> "$GITHUB_STEP_SUMMARY"
